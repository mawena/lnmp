name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Lint (shellcheck + python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Vérifier la syntaxe du script
        run: bash -n packaging/bin/lnmp
      - name: Analyser avec shellcheck
        run: shellcheck packaging/bin/lnmp build.sh
      - name: Vérifier le démon Python
        run: python3 -m py_compile packaging/sbin/lnmpd

  build:
    name: Construire le paquet .deb
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Installer les outils de packaging
        run: |
          sudo apt-get update
          sudo apt-get install -y devscripts debhelper build-essential
      - name: Construire le paquet
        working-directory: packaging
        run: debuild -us -uc -b
      - name: Récupérer le nom du paquet
        id: pkg
        run: echo "deb=$(ls ../lnmp_*_all.deb | head -n1)" >> "$GITHUB_OUTPUT"
      - name: Publier l'artefact de build
        uses: actions/upload-artifact@v4
        with:
          name: lnmp-deb
          path: ${{ steps.pkg.outputs.deb }}

  release:
    name: Publier la release GitHub
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Installer les outils de packaging
        run: |
          sudo apt-get update
          sudo apt-get install -y devscripts debhelper build-essential
      - name: Construire le paquet
        working-directory: packaging
        run: debuild -us -uc -b
      - name: Créer la release et joindre le .deb
        uses: softprops/action-gh-release@v2
        with:
          files: lnmp_*_all.deb
